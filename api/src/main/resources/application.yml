spring:
  application:
    name: smart-park
  profiles:
    active: dev
  jpa:
    open-in-view: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001}
  rate-limit:
    enabled: true
    capacity: 60
    refill-tokens: 60
    refill-period: 1m
  security:
    jwt:
      issuer: smart-park-api
      access-token-ttl: 8h
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    admin:
      name: ${ADMIN_NAME:Operador}
