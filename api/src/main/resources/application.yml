spring:
  application:
    name: smart-park
  profiles:
    active: dev

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState

app:
  rate-limit:
    enabled: true
    capacity: 60
    refill-tokens: 60
    refill-period: 1m
