spring:
  datasource:
    url: jdbc:h2:file:./data/smartpark
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  rate-limit:
    enabled: false
  security:
    jwt:
      secret: ${JWT_SECRET:dev-smart-park-jwt-secret-change-me-please-1234567890}
    admin:
      email: ${ADMIN_EMAIL:admin@smartpark.local}
      password: ${ADMIN_PASSWORD:smartpark123}
